[project]
name = "chess-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "pytest>=9.0.3",
    "python-chess>=1.999",
    "stockfish>=5.2.0",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
]

[tool.pyright]
# reinforcement_learning/ is added to sys.path at runtime, so its subpackages
# (networks, monte_carlo_tree_search, helpers) are importable as top-level.
# Tell Pylance/Pyright the same so imports like `networks.big_network` resolve.
extraPaths = ["reinforcement_learning"]
